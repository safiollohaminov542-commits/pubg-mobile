{% extends "base.html" %}
{% block title %}Заявкаҳо - Kanban{% endblock %}
 
{% block content %}
<style>
    /* ==================== ROOT VARIABLES ==================== */
    :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f5f9;
        --bg-card: #ffffff;
        --bg-column: #f8fafc;
        --border-color: #e2e8f0;
        --border-light: #f1f5f9;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-tertiary: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-purple: #8b5cf6;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-orange: #f59e0b;
        --accent-indigo: #6366f1;
        --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
        --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
        --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --radius-xl: 20px;
        --radius-2xl: 24px;
        --glass-bg: rgba(255,255,255,0.85);
        --glass-border: rgba(255,255,255,0.3);
    }
 
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
 
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
 
    .kanban-wrapper {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg-primary);
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    }
 
 
    /* ==================== HEADER ==================== */
    .kanban-header {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border-color);
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        z-index: 20;
        position: sticky;
        top: 0;
    }
 
    .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }
 
    .board-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: white;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 12px rgba(59,130,246,0.3);
    }
 
    .board-icon:hover {
        transform: scale(1.05) rotate(-2deg);
        box-shadow: 0 6px 16px rgba(59,130,246,0.4);
    }
 
    .board-title-box {
        display: flex;
        flex-direction: column;
    }
 
    .board-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.3px;
    }
 
    .board-stats {
        font-size: 12px;
        color: var(--text-tertiary);
        margin-top: 2px;
    }
 
    .board-stats span {
        color: var(--accent-blue);
        font-weight: 600;
    }
 
    .header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
 
 
    /* ==================== FILTERS ==================== */
    .filters-bar {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 12px 24px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        z-index: 15;
        position: sticky;
        top: 60px;
    }
 
    .filters-left {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        flex: 1;
    }
 
    .filters-right {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
    }
 
    .filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-secondary);
        padding: 8px 14px;
        border-radius: var(--radius-md);
        border: 1.5px solid var(--border-color);
        transition: var(--transition);
        box-shadow: var(--shadow-xs);
        height: 40px;
    }
 
    .filter-group:hover {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.08);
    }
 
    .filter-group:focus-within {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
 
    .filter-group.primary {
        border-color: rgba(59,130,246,0.25);
        background: rgba(59, 130, 246, 0.03);
    }
 
    .filter-group.primary:hover,
    .filter-group.primary:focus-within {
        border-color: var(--accent-blue);
        background: rgba(59, 130, 246, 0.06);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
 
    .filter-group i {
        color: var(--accent-blue);
        font-size: 13px;
        flex-shrink: 0;
    }
 
    .filter-group input, .filter-group select {
        background: transparent;
        border: none;
        color: var(--text-primary);
        padding: 2px 0;
        font-size: 13px;
        font-weight: 500;
        outline: none;
        min-width: 0;
    }
 
    .filter-group input::placeholder {
        color: var(--text-tertiary);
        font-weight: 400;
    }
 
    .filter-group select {
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
        padding-right: 4px;
    }
 
    .filter-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-blue);
        white-space: nowrap;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
 
    .filter-separator {
        color: var(--text-tertiary);
        font-size: 12px;
        padding: 0 2px;
    }
 
 
    /* ==================== KANBAN MAIN ==================== */
    .kanban-main {
        flex: 1;
        overflow: hidden;
        position: relative;
    }
 
    .board-scroll {
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 20px 24px;
        transition: background 0.3s ease;
        scroll-behavior: smooth;
    }
 
    .kanban-board {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        height: 100%;
        min-width: min-content;
    }
 
    /* ==================== COLUMN ==================== */
    .kanban-column {
        min-width: 320px;
        width: 320px;
        max-height: calc(100vh - 180px);
        background: var(--bg-column);
        border-radius: var(--radius-xl);
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        flex-shrink: 0;
        transition: var(--transition);
    }
 
    .kanban-column:hover {
        box-shadow: var(--shadow-md);
    }
 
    .kanban-column.drag-over {
        border-color: var(--accent-blue);
        background: rgba(59,130,246,0.03);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
 
    .column-header {
        padding: 14px 16px;
        background: var(--bg-secondary);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border-color);
        flex-shrink: 0;
        position: sticky;
        top: 0;
        z-index: 2;
    }
 
    .column-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
 
    .column-drag-handle {
        cursor: grab;
        color: var(--text-tertiary);
        font-size: 12px;
        padding: 4px;
        border-radius: 4px;
        transition: var(--transition-fast);
    }
 
    .column-drag-handle:hover {
        color: var(--accent-blue);
        background: rgba(59,130,246,0.08);
    }
 
    .column-drag-handle:active {
        cursor: grabbing;
    }
 
    .column-title h3 {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.2px;
    }
 
    .column-badge {
        background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(99,102,241,0.1));
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-blue);
        min-width: 24px;
        text-align: center;
    }
 
    .column-actions {
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: var(--transition-fast);
    }
 
    .kanban-column:hover .column-actions {
        opacity: 1;
    }
 
    .column-actions i {
        cursor: pointer;
        color: var(--text-tertiary);
        transition: var(--transition-fast);
        font-size: 12px;
        padding: 5px;
        border-radius: var(--radius-sm);
    }
 
    .column-actions i:hover {
        color: var(--accent-blue);
        background: rgba(59,130,246,0.08);
    }
 
 
    /* Cards Container */
    .cards-container {
        padding: 12px;
        flex: 1;
        overflow-y: auto;
        min-height: 80px;
    }
 
    .cards-container::-webkit-scrollbar {
        width: 4px;
    }
 
    .cards-container::-webkit-scrollbar-track {
        background: transparent;
    }
 
    .cards-container::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }
 
    .cards-container::-webkit-scrollbar-thumb:hover {
        background: var(--accent-blue);
    }
 
    /* ==================== REQUEST CARD ==================== */
    .request-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 14px;
        margin-bottom: 10px;
        cursor: grab;
        transition: var(--transition);
        border: 1.5px solid var(--border-color);
        position: relative;
        box-shadow: var(--shadow-xs);
    }
 
    .request-card:active {
        cursor: grabbing;
    }
 
    .request-card.dragging {
        opacity: 0.4;
        transform: rotate(2deg);
    }
 
    .request-card.drag-over-top {
        border-top: 3px solid var(--accent-blue);
        margin-top: -2px;
    }
 
    .request-card.drag-over-bottom {
        border-bottom: 3px solid var(--accent-blue);
        margin-bottom: -2px;
    }
 
    .request-card:hover {
        transform: translateY(-2px);
        border-color: rgba(59,130,246,0.4);
        box-shadow: var(--shadow-md);
    }
 
    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
 
    .card-name {
        font-weight: 700;
        font-size: 13px;
        color: var(--accent-blue);
        background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(99,102,241,0.08));
        padding: 4px 10px;
        border-radius: 20px;
        letter-spacing: -0.1px;
    }
 
    .card-actions {
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: var(--transition-fast);
    }
 
    .request-card:hover .card-actions {
        opacity: 1;
    }
 
    .card-actions button {
        background: var(--bg-tertiary);
        border: none;
        border-radius: var(--radius-sm);
        padding: 5px 8px;
        cursor: pointer;
        font-size: 11px;
        color: var(--text-secondary);
        transition: var(--transition-fast);
    }
 
    .card-actions button:hover {
        background: var(--accent-blue);
        color: white;
        transform: scale(1.05);
    }
 
    .card-phone {
        font-size: 12px;
        color: var(--accent-blue);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-weight: 500;
    }
 
    .card-info {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
    }
 
    .info-tag {
        background: var(--bg-tertiary);
        padding: 3px 8px;
        border-radius: 16px;
        font-size: 10px;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 500;
        transition: var(--transition-fast);
    }
 
    .info-tag:hover {
        background: rgba(59,130,246,0.08);
        color: var(--accent-blue);
    }
 
 
    .files-preview {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        flex-wrap: wrap;
    }
 
    .file-thumb {
        width: 36px;
        height: 36px;
        background: var(--bg-tertiary);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
        border: 1.5px solid var(--border-color);
        transition: var(--transition-fast);
    }
 
    .file-thumb:hover {
        border-color: var(--accent-blue);
        transform: scale(1.08);
        box-shadow: var(--shadow-sm);
    }
 
    .file-thumb img, .file-thumb video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
 
    .card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--text-tertiary);
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border-light);
    }
 
    /* Add Column Button */
    .add-column-btn {
        min-width: 320px;
        width: 320px;
        background: var(--bg-secondary);
        border-radius: var(--radius-xl);
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: var(--transition);
        border: 2px dashed var(--border-color);
        color: var(--text-tertiary);
        flex-shrink: 0;
        font-size: 13px;
        font-weight: 500;
    }
 
    .add-column-btn:hover {
        background: rgba(59,130,246,0.03);
        border-color: var(--accent-blue);
        color: var(--accent-blue);
        transform: translateY(-2px);
    }
 
    /* ==================== BOTTOM BOARDS PANEL ==================== */
    .bottom-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border-color);
        padding: 8px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        overflow-x: auto;
        z-index: 10;
    }
 
    .bottom-panel::-webkit-scrollbar {
        height: 3px;
    }
 
    .board-tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
        background: var(--bg-tertiary);
        flex-shrink: 0;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid transparent;
    }
 
    .board-tab.active {
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
        color: white;
        box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        border-color: transparent;
    }
 
    .board-tab.active span {
        color: white;
    }
 
    .board-tab.active i {
        color: white;
    }
 
    .board-tab:hover:not(.active) {
        transform: translateY(-1px);
        border-color: var(--accent-blue);
        background: rgba(59,130,246,0.05);
    }
 
    .board-tab-icon {
        width: 26px;
        height: 26px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
    }
 
    .board-tab-name {
        font-size: 12px;
        color: var(--text-primary);
    }
 
    .create-board-tab {
        border: 1.5px dashed var(--border-color);
        background: transparent;
    }
 
 
    /* ==================== MODALS ==================== */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        align-items: center;
        justify-content: center;
    }
 
    .modal.active {
        display: flex;
    }
 
    body.modal-open {
        overflow: hidden;
    }
 
    .modal-content {
        background: var(--bg-secondary);
        border-radius: var(--radius-2xl);
        width: 92%;
        max-width: 700px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-xl), 0 0 60px rgba(0,0,0,0.1);
        border: 1px solid var(--border-color);
        animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
    }
 
    .modal-large .modal-content,
    .modal-large.modal .modal-content {
        max-width: 850px;
    }
 
    @keyframes modalIn {
        from { opacity: 0; transform: scale(0.95) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
 
    @keyframes modalOut {
        from { opacity: 1; transform: scale(1) translateY(0); }
        to { opacity: 0; transform: scale(0.95) translateY(10px); }
    }
 
    .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-secondary);
        border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
        flex-shrink: 0;
    }
 
    .modal-header h2 {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 10px;
        letter-spacing: -0.3px;
    }
 
    .modal-header .close {
        font-size: 24px;
        cursor: pointer;
        color: var(--text-tertiary);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius-sm);
        transition: var(--transition-fast);
    }
 
    .modal-header .close:hover {
        color: var(--accent-red);
        background: rgba(239,68,68,0.08);
    }
 
    .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
    }
 
    .modal-body::-webkit-scrollbar {
        width: 5px;
    }
 
    .modal-body::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }
 
    .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-shrink: 0;
        background: var(--bg-secondary);
        border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
    }
 
 
    /* Forms */
    .form-group {
        margin-bottom: 18px;
    }
 
    .form-group label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
    }
 
    .form-group label i {
        color: var(--accent-blue);
        margin-right: 4px;
    }
 
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px 14px;
        background: var(--bg-tertiary);
        border: 1.5px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 500;
        transition: var(--transition);
    }
 
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
        outline: none;
        border-color: var(--accent-blue);
        background: var(--bg-secondary);
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }
 
    .form-group input::placeholder {
        color: var(--text-tertiary);
        font-weight: 400;
    }
 
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }
 
    /* Progress Bar */
    .progress-container {
        margin-top: 10px;
    }
 
    .progress-bar {
        width: 100%;
        height: 5px;
        background: var(--bg-tertiary);
        border-radius: 4px;
        overflow: hidden;
    }
 
    .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent-blue), var(--accent-indigo));
        transition: width 0.3s ease;
        border-radius: 4px;
    }
 
    .file-list {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
 
    .file-item {
        background: var(--bg-tertiary);
        border-radius: var(--radius-md);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        border: 1px solid var(--border-color);
        transition: var(--transition-fast);
    }
 
    .file-item:hover {
        border-color: var(--accent-blue);
        background: rgba(59,130,246,0.03);
    }
 
    .file-item button {
        background: none;
        border: none;
        color: var(--accent-red);
        cursor: pointer;
        padding: 2px;
        border-radius: 4px;
        transition: var(--transition-fast);
    }
 
    .file-item button:hover {
        background: rgba(239,68,68,0.08);
    }
 
    /* View Modal */
    .view-modal-content {
        max-width: 600px;
    }
 
    .info-grid {

                        <label><i class="fas fa-credit-card"></i> Нархи умумӣ (C) *</label>
                        <input type="number" id="totalPrice" required placeholder="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-chart-line"></i> Нархи як м² (C) *</label>
                        <input type="number" id="pricePerM2" required placeholder="Автоматӣ ҳисоб мешавад">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone-alt"></i> Телефон *</label>
                        <input type="tel" id="phone" required placeholder="+992 XXX XX XX XX">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Номи мизоҷ *</label>
                        <input type="text" id="clientName" required placeholder="Ном ва насаб">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user-check"></i> Иҷрокунанда *</label>
                        <select id="executorId" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-comment"></i> Шарҳ</label>
                    <textarea id="comment" rows="3" placeholder="Маълумоти иловагӣ..."></textarea>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-paperclip"></i> Файлҳо</label>
                    <input type="file" id="requestFiles" multiple accept="image/*,video/*,application/pdf,.doc,.docx">
                    <div class="progress-container" id="progressContainer" style="display: none;">
                        <div class="progress-bar"><div class="progress-fill" id="uploadProgressFill"></div></div>
                        <div id="progressText" style="font-size: 11px; margin-top: 6px; color: var(--text-secondary);"></div>
                    </div>
                    <div class="file-list" id="fileListPreview"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeRequestModal()">Бекор</button>
                <button type="submit" class="btn-primary">Сабт</button>
            </div>
        </form>
    </div>
</div>
 
 
<!-- Modal: View Request Details -->
<div id="viewRequestModal" class="modal">
    <div class="modal-content view-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-info-circle"></i> Маълумоти заявка</h2>
            <span class="close" onclick="closeViewModal()">&times;</span>
        </div>
        <div id="viewRequestContent" class="modal-body"></div>
        <div class="modal-footer">
            <button class="btn-secondary" style="background:var(--accent-red);color:white;border-color:var(--accent-red);" id="viewDeleteBtn" onclick="deleteRequestFromView()"><i class="fas fa-trash-alt"></i> Нест кардан</button>
            <button class="btn-secondary" onclick="closeViewModal()">Пӯшидан</button>
        </div>
    </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js"></script>
<script>
// ==================== ГЛОБАЛӢ ====================
let currentBoardId = null;
let allBoards = [];
let allColumns = [];
let allRequests = [];
let currentUserId = {{ session.user_id }};
let currentUserRole = "{{ session.role }}";
let draggedColumnId = null;
let draggedCard = null;
let filterTimeout = null;
 
// ==================== BUG FIX: PER-MODAL FILES ====================
// Instead of a global currentFiles, we use modalFiles which is ALWAYS
// freshly initialized when opening create/edit modal.
// This prevents file leaking between requests.
let modalFiles = [];
 
// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', async () => {
    await loadBoards();
    loadUsersForSelect();
    setupAutoCalculate();
    setTimeout(loadFilters, 500);
});
 
// ==================== AUTO CALCULATE PRICE PER M2 ====================
function setupAutoCalculate() {
    const totalPriceInput = document.getElementById('totalPrice');
    const areaInput = document.getElementById('area');
    const pricePerM2Input = document.getElementById('pricePerM2');
 
    function calculate() {
        const totalPrice = parseFloat(totalPriceInput.value);
        const area = parseFloat(areaInput.value);
        if (totalPrice > 0 && area > 0) {
            pricePerM2Input.value = Math.round(totalPrice / area);
        }
    }
 
    totalPriceInput.addEventListener('input', calculate);
    areaInput.addEventListener('input', calculate);
}
 
 
async function loadUsersForSelect() {
    const res = await fetch('/api/users/list');
    const users = await res.json();
    const select = document.getElementById('executorId');
    select.innerHTML = '<option value="">Интихоб...</option>' + 
        users.map(u => `<option value="${u.id}">${escapeHtml(u.full_name)} (${u.category})</option>`).join('');
    
    const filter = document.getElementById('authorFilter');
    filter.innerHTML = '<option value="all">Ҳама</option>' + 
        users.map(u => `<option value="${u.id}">${escapeHtml(u.full_name)}</option>`).join('');
}
 
// ==================== BOARD API ====================
async function loadBoards() {
    try {
        const res = await fetch('/api/requests-boards');
        allBoards = await res.json();
        if (allBoards.length && !currentBoardId) currentBoardId = allBoards[0].id;
        if (currentBoardId) await loadBoardData();
        renderBoardsPanel();
        updateBoardUI();
        if (!allBoards.length) document.getElementById('kanbanBoard').innerHTML = '<div class="loading"><i class="fas fa-inbox" style="font-size:32px;"></i><span>Доска нест. Доскаи аввалро эҷод кунед!</span></div>';
    } catch(e) { console.error(e); }
}
 
async function loadBoardData() {
    if (!currentBoardId) return;
    await Promise.all([loadColumns(), loadRequests()]);
    renderKanbanBoard();
    updateTotalCount();
}
 
async function loadColumns() {
    try {
        const res = await fetch(`/api/requests-boards/${currentBoardId}/columns`);
        allColumns = await res.json();
        updateColumnFilter();
    } catch(e) { allColumns = []; }
}
 
async function loadRequests() {
    try {
        const res = await fetch(`/api/requests-board/${currentBoardId}/requests`);
        allRequests = await res.json();
        document.getElementById('totalRequestsCount').textContent = allRequests.length;
    } catch(e) { allRequests = []; }
}
 
function renderBoardsPanel() {
    const panel = document.getElementById('boardsBottomPanel');
    panel.innerHTML = allBoards.map(b => `
        <div class="board-tab ${currentBoardId === b.id ? 'active' : ''}" onclick="switchBoard(${b.id})">
            <div class="board-tab-icon" style="background:${b.color || '#3b82f6'}"><i class="fas fa-chalkboard"></i></div>
            <span class="board-tab-name">${escapeHtml(b.title)}</span>
        </div>
    `).join('') + `<div class="board-tab create-board-tab" onclick="showAddBoardModal()"><i class="fas fa-plus"></i><span>Нав</span></div>`;
}
 
function updateBoardUI() {
    const b = allBoards.find(b => b.id === currentBoardId);
    if(b) {
        document.getElementById('currentBoardTitle').textContent = b.title;
        document.getElementById('boardContainer').style.background = b.color || '#f8fafc';
    }
}
 
async function switchBoard(id) {
    currentBoardId = id;
    await loadBoardData();
    renderBoardsPanel();
    updateBoardUI();
    resetFilters();
    showToast('Доска иваз шуд');
}
 
function updateColumnFilter() {
    const sel = document.getElementById('columnFilter');
    const prev = sel.value;
    sel.innerHTML = '<option value="all">Ҳама колонкаҳо</option>' + allColumns.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join('');
    if (prev) sel.value = prev;
}
 
 
// ==================== RENDER ====================
function renderKanbanBoard() {
    const container = document.getElementById('kanbanBoard');
    if (!allColumns.length) {
        container.innerHTML = `<div class="add-column-btn" onclick="showAddColumnModal()"><i class="fas fa-plus"></i> Колонкаи аввалро эҷод кунед</div>`;
        return;
    }
    
    const sortedCols = [...allColumns].sort((a,b) => a.order_index - b.order_index);
    
    container.innerHTML = sortedCols.map(col => `
        <div class="kanban-column" data-column-id="${col.id}" data-column-title="${escapeHtml(col.title)}"
             ondragover="handleColumnDragOver(event)" ondrop="handleColumnDrop(event)" ondragleave="handleDragLeave(event)">
            <div class="column-header" style="border-bottom-color: ${col.color || '#3b82f6'}">
                <div class="column-left">
                    <i class="fas fa-grip-vertical column-drag-handle" draggable="true" 
                       ondragstart="handleColumnDragStart(event, ${col.id})" ondragend="handleDragEnd(event)"></i>
                    <div class="column-title"><h3>${escapeHtml(col.title)}</h3></div>
                    <span class="column-badge">${allRequests.filter(r => r.column_id === col.id).length}</span>
                </div>
                <div class="column-actions">
                    <i class="fas fa-edit" onclick="event.stopPropagation(); editColumn(${col.id})" title="Таҳрир"></i>
                    <i class="fas fa-trash-alt" onclick="event.stopPropagation(); deleteColumn(${col.id})" title="Нест кардан" style="color: var(--accent-red);"></i>
                </div>
            </div>
            <div class="cards-container" data-column-id="${col.id}"
                 ondragover="handleCardDragOver(event)" ondrop="handleCardDrop(event)">
                ${renderCards(col.id)}
            </div>
        </div>
    `).join('');
    
    container.innerHTML += `<div class="add-column-btn" onclick="showAddColumnModal()"><i class="fas fa-plus"></i> Колонкаи нав</div>`;
}
 
function renderCards(columnId) {
    const requests = allRequests.filter(r => r.column_id === columnId).sort((a,b) => (a.order_index || 0) - (b.order_index || 0));
    if (!requests.length) return '<div class="empty-column-msg"><i class="fas fa-inbox"></i> Заявка нест</div>';
    
    return requests.map(req => {
        let files = [];
        try { files = req.files ? JSON.parse(req.files) : []; } catch(e) { files = []; }
        return `
        <div class="request-card" data-request-id="${req.id}" data-order="${req.order_index || 0}" draggable="true"
             ondragstart="handleCardDragStart(event)" ondragend="handleCardDragEnd(event)"
             ondblclick="viewRequest(${req.id})">
            <div class="card-header">
                <span class="card-name">${escapeHtml(req.client_name)}</span>
                <div class="card-actions">
                    <button onclick="event.stopPropagation(); editRequest(${req.id})" title="Таҳрир"><i class="fas fa-pen"></i></button>
                    <button onclick="event.stopPropagation(); deleteRequest(${req.id})" title="Нест кардан"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="card-phone"><i class="fas fa-phone-alt"></i> ${escapeHtml(req.phone)}</div>
            <div class="card-info">
                <span class="info-tag"><i class="fas fa-building"></i> ${escapeHtml(req.property_type)}</span>
                <span class="info-tag"><i class="fas fa-ruler-combined"></i> ${req.area} м²</span>
                <span class="info-tag"><i class="fas fa-door-open"></i> ${req.rooms} хона</span>
            </div>
            <div class="card-info">
                <span class="info-tag"><i class="fas fa-credit-card"></i> ${formatPrice(req.total_price)} C</span>
                <span class="info-tag"><i class="fas fa-chart-line"></i> ${formatPrice(req.price_per_m2)} C/м²</span>
            </div>
            ${files.length ? `
            <div class="files-preview">
                ${files.slice(0, 3).map(f => `
                    <div class="file-thumb" onclick="event.stopPropagation(); window.open('${f.path}', '_blank')">
                        ${f.type === 'image' ? `<img src="${f.path}" alt="preview">` : f.type === 'video' ? `<video src="${f.path}"></video>` : `<i class="fas fa-file-alt"></i>`}
                    </div>
                `).join('')}
                ${files.length > 3 ? `<div class="file-thumb" onclick="event.stopPropagation(); viewRequest(${req.id})"><span style="font-size:9px;font-weight:700;">+${files.length-3}</span></div>` : ''}
            </div>
            ` : ''}
            <div class="card-meta">
                <span><i class="far fa-calendar-alt"></i> ${new Date(req.created_date).toLocaleDateString()}</span>
                <span><i class="fas fa-user-check"></i> ${escapeHtml(req.executor_name || '—')}</span>
            </div>
        </div>`;
    }).join('');
}
 
 
// ==================== DRAG & DROP ====================
function handleColumnDragStart(e, columnId) {
    draggedColumnId = columnId;
    e.dataTransfer.setData('text/plain', columnId);
    e.dataTransfer.effectAllowed = 'move';
}
 
function handleColumnDragOver(e) {
    e.preventDefault();
    const col = e.target.closest('.kanban-column');
    if (col && draggedColumnId && col.dataset.columnId != draggedColumnId) {
        col.classList.add('drag-over');
    }
}
 
function handleDragLeave(e) {
    const col = e.target.closest('.kanban-column');
    if (col) col.classList.remove('drag-over');
}
 
function handleDragEnd(e) {
    document.querySelectorAll('.kanban-column').forEach(c => c.classList.remove('drag-over'));
    draggedColumnId = null;
}
 
async function handleColumnDrop(e) {
    e.preventDefault();
    const targetCol = e.target.closest('.kanban-column');
    if (!targetCol || !draggedColumnId) return;
    
    targetCol.classList.remove('drag-over');
    const targetId = parseInt(targetCol.dataset.columnId);
    const sourceId = draggedColumnId;
    if (sourceId === targetId) return;
    
    await fetch(`/api/requests-columns/${sourceId}/order`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ target_id: targetId })
    });
    
    draggedColumnId = null;
    await loadColumns();
    renderKanbanBoard();
    showToast('Колонка ҷой иваз шуд');
}
 
function handleCardDragStart(e) {
    e.stopPropagation();
    const card = e.target.closest('.request-card');
    if (!card) return;
    draggedCard = card;
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', card.dataset.requestId);
    e.dataTransfer.effectAllowed = 'move';
}
 
function handleCardDragEnd(e) {
    document.querySelectorAll('.request-card').forEach(c => c.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
    document.querySelectorAll('.cards-container').forEach(c => c.classList.remove('drag-over'));
    draggedCard = null;
}
 
function handleCardDragOver(e) {
    e.preventDefault();
    const card = e.target.closest('.request-card');
    const container = e.target.closest('.cards-container');
    
    // Clear previous highlights
    document.querySelectorAll('.request-card.drag-over-top, .request-card.drag-over-bottom').forEach(c => {
        if (c !== card) { c.classList.remove('drag-over-top', 'drag-over-bottom'); }
    });
    
    if (card && draggedCard && card !== draggedCard) {
        const rect = card.getBoundingClientRect();
        const mouseY = e.clientY;
        const isTop = mouseY < rect.top + rect.height / 2;
        
        card.classList.remove('drag-over-top', 'drag-over-bottom');
        if (isTop) {
            card.classList.add('drag-over-top');
        } else {
            card.classList.add('drag-over-bottom');
        }
    }
}
 
async function handleCardDrop(e) {
    e.preventDefault();
    const targetCard = e.target.closest('.request-card');
    const targetContainer = e.target.closest('.cards-container');
    const leadId = parseInt(e.dataTransfer.getData('text/plain'));
    
    document.querySelectorAll('.request-card').forEach(c => c.classList.remove('drag-over-top', 'drag-over-bottom'));
    document.querySelectorAll('.cards-container').forEach(c => c.classList.remove('drag-over'));
    
    let newColumnId = parseInt(targetContainer?.dataset.columnId);
    let newOrder = null;
    
    if (targetCard) {
        newColumnId = parseInt(targetCard.closest('.cards-container').dataset.columnId);
        const rect = targetCard.getBoundingClientRect();
        const mouseY = e.clientY;
        const isTop = mouseY < rect.top + rect.height / 2;
        const currentOrder = parseInt(targetCard.dataset.order);
        newOrder = isTop ? currentOrder : currentOrder + 1;
    }
    
    await fetch('/api/requests-move', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ request_id: leadId, column_id: newColumnId, order_index: newOrder })
    });
    
    await loadRequests();
    renderKanbanBoard();
    updateTotalCount();
    showToast('Заявка ҷой иваз шуд');
}
 
 
// ==================== FILTERS ====================
function getFloorNumber(floorValue) {
    if (floorValue === null || floorValue === undefined) return null;
    const str = String(floorValue);
    const parts = str.split('/');
    return parseInt(parts[0]);
}
 
function filterRequests() {
    if (filterTimeout) clearTimeout(filterTimeout);
    filterTimeout = setTimeout(() => {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const type = document.getElementById('typeFilter').value;
        const author = document.getElementById('authorFilter').value;
        const dateFilter = document.getElementById('dateFilter').value;
        const columnFilter = document.getElementById('columnFilter').value;
        const priceMin = parseFloat(document.getElementById('priceMinFilter').value) || null;
        const priceMax = parseFloat(document.getElementById('priceMaxFilter').value) || null;
        const priceM2Min = parseFloat(document.getElementById('priceM2MinFilter').value) || null;
        const priceM2Max = parseFloat(document.getElementById('priceM2MaxFilter').value) || null;
        const areaMin = parseFloat(document.getElementById('areaMinFilter').value) || null;
        const areaMax = parseFloat(document.getElementById('areaMaxFilter').value) || null;
        const floorMin = parseInt(document.getElementById('floorMinFilter').value) || null;
        const floorMax = parseInt(document.getElementById('floorMaxFilter').value) || null;
        
        let visibleCards = 0;
        document.querySelectorAll('.request-card').forEach(card => {
            const reqId = parseInt(card.dataset.requestId);
            const req = allRequests.find(r => r.id === reqId);
            if (!req) return;
            
            let show = true;
            if (search && !req.client_name.toLowerCase().includes(search) && !req.phone.includes(search) && !req.address.toLowerCase().includes(search)) show = false;
            if (type !== 'all' && req.property_type !== type) show = false;
            if (author !== 'all' && req.author_id != author) show = false;
            if (columnFilter !== 'all' && req.column_id != columnFilter) show = false;
            
            if (priceMin !== null && req.total_price < priceMin) show = false;
            if (priceMax !== null && req.total_price > priceMax) show = false;
            if (priceM2Min !== null && req.price_per_m2 < priceM2Min) show = false;
            if (priceM2Max !== null && req.price_per_m2 > priceM2Max) show = false;
            if (areaMin !== null && req.area < areaMin) show = false;
            if (areaMax !== null && req.area > areaMax) show = false;
            
            if (floorMin !== null || floorMax !== null) {
                const floorNum = getFloorNumber(req.floor);
                if (floorMin !== null && floorNum < floorMin) show = false;
                if (floorMax !== null && floorNum > floorMax) show = false;
            }
            
            if (dateFilter === 'today') {
                const today = new Date().toDateString();
                if (new Date(req.created_date).toDateString() !== today) show = false;
            } else if (dateFilter === 'week') {
                const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
                if (new Date(req.created_date) < weekAgo) show = false;
            } else if (dateFilter === 'month') {
                const monthAgo = new Date(); monthAgo.setDate(monthAgo.getDate() - 30);
                if (new Date(req.created_date) < monthAgo) show = false;
            }
            
            card.style.display = show ? 'block' : 'none';
            if (show) visibleCards++;
        });
        document.getElementById('totalRequestsCount').textContent = visibleCards;
    }, 200);
}
 
function saveFilters() {
    const filters = {
        search: document.getElementById('searchInput').value,
        type: document.getElementById('typeFilter').value,
        author: document.getElementById('authorFilter').value,
        date: document.getElementById('dateFilter').value,
        column: document.getElementById('columnFilter').value,
        priceMin: document.getElementById('priceMinFilter').value,
        priceMax: document.getElementById('priceMaxFilter').value,
        priceM2Min: document.getElementById('priceM2MinFilter').value,
        priceM2Max: document.getElementById('priceM2MaxFilter').value,
        areaMin: document.getElementById('areaMinFilter').value,
        areaMax: document.getElementById('areaMaxFilter').value,
        floorMin: document.getElementById('floorMinFilter').value,
        floorMax: document.getElementById('floorMaxFilter').value,
    };
    document.cookie = `kanban_filters=${encodeURIComponent(JSON.stringify(filters))};path=/;max-age=86400`;
}
 
function loadFilters() {
    try {
        const match = document.cookie.match(/kanban_filters=([^;]+)/);
        if (!match) return;
        const filters = JSON.parse(decodeURIComponent(match[1]));
        if (filters.search) document.getElementById('searchInput').value = filters.search;
        if (filters.type) document.getElementById('typeFilter').value = filters.type;
        if (filters.author) document.getElementById('authorFilter').value = filters.author;
        if (filters.date) document.getElementById('dateFilter').value = filters.date;
        if (filters.column) document.getElementById('columnFilter').value = filters.column;
        if (filters.priceMin) document.getElementById('priceMinFilter').value = filters.priceMin;
        if (filters.priceMax) document.getElementById('priceMaxFilter').value = filters.priceMax;
        if (filters.priceM2Min) document.getElementById('priceM2MinFilter').value = filters.priceM2Min;
        if (filters.priceM2Max) document.getElementById('priceM2MaxFilter').value = filters.priceM2Max;
        if (filters.areaMin) document.getElementById('areaMinFilter').value = filters.areaMin;
        if (filters.areaMax) document.getElementById('areaMaxFilter').value = filters.areaMax;
        if (filters.floorMin) document.getElementById('floorMinFilter').value = filters.floorMin;
        if (filters.floorMax) document.getElementById('floorMaxFilter').value = filters.floorMax;
        filterRequests();
    } catch(e) {}
}
 
function resetFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('typeFilter').value = 'all';
    document.getElementById('authorFilter').value = 'all';
    document.getElementById('dateFilter').value = 'all';
    document.getElementById('columnFilter').value = 'all';
    document.getElementById('priceMinFilter').value = '';
    document.getElementById('priceMaxFilter').value = '';
    document.getElementById('priceM2MinFilter').value = '';
    document.getElementById('priceM2MaxFilter').value = '';
    document.getElementById('areaMinFilter').value = '';
    document.getElementById('areaMaxFilter').value = '';
    document.getElementById('floorMinFilter').value = '';
    document.getElementById('floorMaxFilter').value = '';
    document.cookie = 'kanban_filters=;path=/;max-age=0';
    filterRequests();
    showToast('Филтрҳо тоза шуданд');
}
 
 
// ==================== CRUD ====================
async function createColumn(title, color) {
    const res = await fetch('/api/requests-columns', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ board_id: currentBoardId, title, color })
    });
    if (res.ok) { await loadColumns(); renderKanbanBoard(); showToast('Колонка эҷод шуд'); }
}
 
async function updateColumn(id, title, color) {
    const res = await fetch(`/api/requests-columns/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title, color })
    });
    if (res.ok) { await loadColumns(); renderKanbanBoard(); showToast('Колонка нав шуд'); }
}
 
async function deleteColumn(id) {
    if (!confirm('Колонкаро нест кардан? Ҳама заявкаҳо нест мешаванд!')) return;
    const res = await fetch(`/api/requests-columns/${id}`, { method: 'DELETE' });
    if (res.ok) { await loadColumns(); await loadRequests(); renderKanbanBoard(); updateTotalCount(); showToast('Колонка нест шуд'); }
}
 
async function createRequest(data) {
    const res = await fetch('/api/requests-new', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    return res.ok;
}
 
async function updateRequestData(id, data) {
    const res = await fetch(`/api/requests-update/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    return res.ok;
}
 
async function deleteRequest(id) {
    if (!confirm('Заявкаро нест кардан?')) return;
    const res = await fetch(`/api/requests-delete/${id}`, { method: 'DELETE' });

async function uploadFilesWithProgress(files, onProgress) {
    const uploaded = [];
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const formData = new FormData();
        formData.append('file', file);
        
        const xhr = new XMLHttpRequest();
        const promise = new Promise((resolve, reject) => {
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable && onProgress) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    onProgress(i, files.length, file.name, percent);
                }
            });
            xhr.onload = () => {
                if (xhr.status === 200) { resolve(JSON.parse(xhr.responseText)); }
                else { reject(); }
            };
            xhr.onerror = reject;
            xhr.open('POST', '/api/upload-request-file');
            xhr.send(formData);
        });
        const result = await promise;
        uploaded.push(result);
    }
    return uploaded;
}

function initMediaGalleryDnD(req) {
    const gallery = document.getElementById('mediaGallery');
    if (!gallery) return;
    
    let dragSrcIdx = null;
    
    gallery.querySelectorAll('.media-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
            dragSrcIdx = parseInt(item.dataset.idx);
            item.style.opacity = '0.5';
            e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', () => { item.style.opacity = '1'; });
        item.addEventListener('dragover', (e) => { e.preventDefault(); item.style.border = '2px dashed var(--accent-blue)'; item.style.borderRadius = 'var(--radius-md)'; });
        item.addEventListener('dragleave', () => { item.style.border = ''; });
        item.addEventListener('drop', async (e) => {
            e.preventDefault();
            item.style.border = '';
            const targetIdx = parseInt(item.dataset.idx);
            if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
            
            const newFiles = [...currentViewFiles];
            const [moved] = newFiles.splice(dragSrcIdx, 1);
            newFiles.splice(targetIdx, 0, moved);
            currentViewFiles = newFiles;
            
            await updateRequestData(req.id, { files: currentViewFiles });
            const idx = allRequests.findIndex(r => r.id === req.id);
            if (idx !== -1) allRequests[idx].files = JSON.stringify(currentViewFiles);
            
            renderViewModal(req, currentViewFiles);
            showToast('Ҷойи аксҳо иваз шуд');
        });
    });
}

        floor: parseInt(document.getElementById('floor').value),
        total_floors: parseInt(document.getElementById('totalFloors').value),
        total_price: parseFloat(document.getElementById('totalPrice').value),
        price_per_m2: parseFloat(document.getElementById('pricePerM2').value),
        phone: document.getElementById('phone').value,
        client_name: document.getElementById('clientName').value,
        executor_id: parseInt(document.getElementById('executorId').value),
        comment: document.getElementById('comment').value,
        files: uploadedFiles,
        column_id: firstColumnId,
        board_id: currentBoardId,
        order_index: requestId ? undefined : 0
    };
    
    let success;
    if (requestId) { success = await updateRequestData(parseInt(requestId), data); }
    else { success = await createRequest(data); }
    
    if (success) {
        closeRequestModal();
        await loadRequests();
        renderKanbanBoard();
        updateTotalCount();
        showToast(requestId ? 'Заявка нав шуд' : 'Заявка эҷод шуд');
    } else { showToast('Хатогӣ ҳангоми сабт', 3000); }
});
 
// Color palette click
document.querySelectorAll('.color-option').forEach(opt => {
    opt.addEventListener('click', () => {
        document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        document.getElementById('columnColor').value = opt.dataset.color;
    });
});
 
// Escape key to close modals
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeBoardModal(); closeSelectBoardModal(); closeBoardSettingsModal();
        closeColumnModal(); closeRequestModal(); closeViewModal();
    }
});
 
// Close modal when clicking backdrop
document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
            modal.classList.remove('active');
            const anyOpen = document.querySelector('.modal.active');
            if (!anyOpen) document.body.classList.remove('modal-open');
        }
    });
});
</script>
{% endblock %}
